# Le push one-shot de la mi-temps. Il ne part qu'une fois : la garde de
# date fait des jeudis suivants un no-op, et CE FICHIER SE SUPPRIME une
# fois l'annonce passée — comme `announce-duels.yml` en son temps.
#
# 07:00 UTC = 09:00 Paris (CEST pendant le challenge). L'écran, lui, est
# ouvert depuis minuit : la notification ne déverrouille rien, elle
# réveille. Le retard de file de GitHub (5 à 20 min à l'heure ronde) n'a
# donc aucun effet ici.
#
# Déclenchement manuel possible en secours : la garde ne s'applique qu'au
# cron, un `workflow_dispatch` envoie toujours. À manier avec la même
# prudence que le reste — au bout du fil il y a six téléphones.

name: Mi-temps

on:
  schedule:
    - cron: "0 7 * * 4" # jeudi 07:00 UTC (09:00 Paris)
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Garde de date (cron uniquement)
        if: github.event_name == 'schedule'
        run: |
          [ "$(date -u +%F)" = "2026-08-07" ] || { echo "pas le 07/08, no-op"; exit 0; }
          echo "SEND=1" >> "$GITHUB_ENV"

      - name: Envoi manuel — toujours
        if: github.event_name == 'workflow_dispatch'
        run: echo "SEND=1" >> "$GITHUB_ENV"

      - name: Appeler /api/cron/mi-temps
        if: env.SEND == '1'
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://leochallenge.vercel.app/api/cron/mi-temps
